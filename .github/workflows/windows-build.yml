name: Windows 安装包
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 下载入口回归测试
        run: npm test
      - name: 前端类型检查与构建
        run: npm run build
      - name: Windows Rust 测试
        run: cargo test --locked --lib -j 2
        working-directory: src-tauri
      - name: 准备手动安装包配置
        run: node -e "require('node:fs').writeFileSync('tauri.manual.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"
      - name: 构建 Windows 安装包
        run: npm run tauri build -- --config tauri.manual.conf.json
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: aram-helper-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
